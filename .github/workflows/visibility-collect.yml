name: Collect visibility data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect connected businesses
        env:
          VISIBILITY_CRON_SECRET: ${{ secrets.VISIBILITY_CRON_SECRET }}
        run: |
          if [ -z "$VISIBILITY_CRON_SECRET" ]; then
            echo "VISIBILITY_CRON_SECRET is not configured" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 20 \
            --max-time 720 \
            -X POST \
            -H "Authorization: Bearer $VISIBILITY_CRON_SECRET" \
            https://app.streetvouch.com/api/visibility/collect
